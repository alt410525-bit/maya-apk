name: Build Maya Clone APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -x lint

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-clone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon -x lint

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-clone-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: maya-clone-debug-apk
          path: artifacts

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site
          cp artifacts/app-debug.apk _site/maya-clone-debug.apk
          echo '<!DOCTYPE html><html><head><title>Maya Clone APK</title></head><body><h1>Maya Clone</h1><p><a href="maya-clone-debug.apk">Download Debug APK</a></p></body></html>' > _site/index.html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: _site